name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - name: Manifest and locales are valid JSON
        run: node -e "for (const f of ['manifest.json','_locales/en/messages.json','_locales/id/messages.json']) JSON.parse(require('fs').readFileSync('extension/' + f, 'utf8'))"
