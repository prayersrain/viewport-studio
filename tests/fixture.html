<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viewport smoke fixture</title><style>body{font:18px system-ui;padding:20px;background:#f5f6ed}button,input{font:inherit;padding:12px;max-width:90%}pre{white-space:pre-wrap}section{margin-top:900px;background:#dbe6c6;padding:20px}</style><h1>Viewport smoke test</h1><pre id="metrics"></pre><button id="count">Klik: 0</button><p><input aria-label="Input uji" placeholder="Ketik di sini"></p><p id="echo"></p><section>Bagian bawah halaman. Preview harus tetap menampilkan bagian ini setelah scroll.</section><script>let n=0;const metrics=document.querySelector('#metrics');function update(){metrics.textContent=JSON.stringify({width:innerWidth,height:innerHeight,dpr:devicePixelRatio,touchPoints:navigator.maxTouchPoints,orientation:screen.orientation.type},null,2)}addEventListener('resize',update);update();document.querySelector('#count').onclick=e=>e.target.textContent='Klik: '+(++n);document.querySelector('input').oninput=e=>document.querySelector('#echo').textContent=e.target.value;</script></html>
